name: sync-upstream-and-build

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/caidaoli/CLIProxyAPI.git
          git fetch upstream main --tags --force

      - name: Check upstream changes
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream already included; no build needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream has new commits; will sync and build."
          fi

      - name: Sync upstream and keep glibc Dockerfile
        if: steps.check.outputs.changed == 'true'
        run: |
          # 备份本分支(glibc) Dockerfile —— merge 可能被上游改动覆盖
          cp Dockerfile /tmp/Dockerfile.glibc.mine
          # merge 创建合并提交需要身份，必须先配置（否则 empty ident name）
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 优先普通合并：保留上游代码更新；若产生冲突则以本分支(ours)为准。
          # 关键：用 merge 而非 reset，保留 fork 历史 -> push 不再是 non-fast-forward。
          git merge --no-edit upstream/main 2>/dev/null || git merge --no-edit -X ours upstream/main
          # 无论合并结果如何，Dockerfile 强制恢复为我方 glibc 版（满足 dlopen 动态插件）
          cp /tmp/Dockerfile.glibc.mine Dockerfile
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync upstream + keep glibc Dockerfile"
          fi
          grep -n '^FROM' Dockerfile
          grep -n 'CGO_ENABLED' Dockerfile
          git push origin main

      - name: Resolve upstream version
        id: version
        if: steps.check.outputs.changed == 'true'
        run: |
          VER=$(git tag --sort=-v:refname | grep '^fork/v' | head -1 | sed 's|^fork/||')
          if [ -z "$VER" ]; then VER=$(date -u +%Y%m%d%H%M); fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Upstream version: $VER"

      - name: Tag and push mirror image
        if: steps.check.outputs.changed == 'true'
        run: |
          TAG="mirror/${{ steps.version.outputs.version }}-glibc"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skip."
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Pushed $TAG; docker-image workflow will build the image."
          fi

      - name: Trigger docker-image build
        if: steps.check.outputs.changed == 'true'
        run: |
          # GITHUB_TOKEN 推送 tag 不会触发 on:push:tags 的 docker-image（GitHub 限制），
          # 因此这里显式 dispatch 触发构建。
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/docker-image.yml/dispatches \
            -d "{\"ref\":\"mirror/${{ steps.version.outputs.version }}-glibc\",\"inputs\":{\"tag\":\"${{ steps.version.outputs.version }}-glibc\"}}"
          echo "Dispatched docker-image build for ${{ steps.version.outputs.version }}"