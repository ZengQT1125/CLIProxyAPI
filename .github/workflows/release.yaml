name: Build and Release

on:
  push:
    tags:
      - 'fork/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '手动指定版本标签(例如: fork/v7.42.0)'
        required: true

permissions:
  contents: write

env:
  GO_VERSION: '1.26.4'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            output: cli-proxy-api-darwin-amd64
            cgo_enabled: '1'
          - target: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            output: cli-proxy-api-darwin-arm64
            cgo_enabled: '1'
          - target: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            output: cli-proxy-api-linux-amd64
            cgo_enabled: '1'
            manylinux_image: quay.io/pypa/manylinux2014_x86_64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            output: cli-proxy-api-linux-arm64
            cgo_enabled: '1'
            manylinux_image: quay.io/pypa/manylinux2014_aarch64
          - target: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            output: cli-proxy-api-windows-amd64.exe
            cgo_enabled: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Checkout dispatch tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            fork/v*) ;;
            *) echo "release tag must match fork/v*" >&2; exit 1 ;;
          esac
          git checkout --detach "$RELEASE_TAG"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Windows CGO toolchain
        if: ${{ matrix.goos == 'windows' }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: mingw-w64-x86_64-gcc

      - name: Generate build metadata
        id: metadata
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          case "$tag" in
            fork/v*) ;;
            *) echo "release tag must match fork/v*" >&2; exit 1 ;;
          esac
          {
            echo "tag=$tag"
            echo "version=${tag#fork/}"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          OUTPUT: ${{ matrix.output }}
          CGO_ENABLED_VALUE: ${{ matrix.cgo_enabled }}
          MANYLINUX_IMAGE: ${{ matrix.manylinux_image }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          COMMIT: ${{ steps.metadata.outputs.commit }}
          BUILD_DATE: ${{ steps.metadata.outputs.build_date }}
        run: |
          set -euo pipefail
          rm -rf "dist/${GOOS}-${GOARCH}"
          mkdir -p dist

          if [[ "$GOOS" == "linux" && "$CGO_ENABLED_VALUE" == "1" ]]; then
            docker run --rm \
              -v "$PWD:/src" \
              -w /src \
              -e GO_VERSION \
              -e GOARCH \
              -e OUTPUT \
              -e RELEASE_VERSION \
              -e COMMIT \
              -e BUILD_DATE \
              "$MANYLINUX_IMAGE" \
              bash -euo pipefail -c '
                go_archive="go${GO_VERSION}.linux-${GOARCH}.tar.gz"
                curl -fsSL "https://go.dev/dl/${go_archive}" -o "/tmp/${go_archive}"
                rm -rf /usr/local/go
                tar -C /usr/local -xzf "/tmp/${go_archive}"
                export PATH="/usr/local/go/bin:${PATH}"

                CGO_ENABLED=1 GOOS=linux GOARCH="${GOARCH}" go build \
                  -buildvcs=false \
                  -trimpath \
                  -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
                  -o "dist/${OUTPUT}" ./cmd/server/

                glibc_versions="$(readelf --version-info "dist/${OUTPUT}" | sed -n "s/.*Name: GLIBC_\([0-9.]*\).*/\1/p" | sort -Vu)"
                if [[ -n "${glibc_versions}" ]]; then
                  printf "GLIBC versions:\n%s\n" "${glibc_versions}"
                  max_glibc="$(printf "%s\n" "${glibc_versions}" | sort -V | tail -n 1)"
                  if [[ "$(printf "2.17\n%s\n" "${max_glibc}" | sort -V | tail -n 1)" != "2.17" ]]; then
                    printf "linux ${GOARCH} binary requires GLIBC_%s, expected GLIBC_2.17 or older\n" "${max_glibc}" >&2
                    exit 1
                  fi
                fi
              '
          else
            CGO_ENABLED="$CGO_ENABLED_VALUE" GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -buildvcs=false \
              -trimpath \
              -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
              -o "dist/$OUTPUT" ./cmd/server/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Resolve release tag
        id: metadata
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          case "$tag" in
            fork/v*) ;;
            *) echo "release tag must match fork/v*" >&2; exit 1 ;;
          esac
          git checkout --detach "$tag"
          {
            echo "tag=$tag"
            echo "version=${tag#fork/}"
          } >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(cli-proxy-api-*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release binaries found" >&2
            exit 1
          fi
          sha256sum "${files[@]}" | sort -k2 > checksums.txt
          cat checksums.txt

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          prev_tag="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"

          {
            echo "## What's Changed"
            echo
          } > release_notes.md

          if [ -n "$prev_tag" ]; then
            git log "${prev_tag}..${RELEASE_TAG}" --pretty=format:"%h|%s" > commits.txt

            features="$(grep -E '^[a-f0-9]+\|feat(\(.+\))?:' commits.txt || true)"
            fixes="$(grep -E '^[a-f0-9]+\|fix(\(.+\))?:' commits.txt || true)"
            refactors="$(grep -E '^[a-f0-9]+\|refactor(\(.+\))?:' commits.txt || true)"
            others="$(grep -vE '^[a-f0-9]+\|(feat|fix|refactor|docs|test|ci|chore)(\(.+\))?:' commits.txt || true)"

            if [ -n "$features" ]; then
              echo "### Features" >> release_notes.md
              echo "$features" | while IFS='|' read -r hash msg; do
                echo "- $msg (\`$hash\`)" >> release_notes.md
              done
              echo >> release_notes.md
            fi

            if [ -n "$fixes" ]; then
              echo "### Bug Fixes" >> release_notes.md
              echo "$fixes" | while IFS='|' read -r hash msg; do
                echo "- $msg (\`$hash\`)" >> release_notes.md
              done
              echo >> release_notes.md
            fi

            if [ -n "$refactors" ]; then
              echo "### Refactors" >> release_notes.md
              echo "$refactors" | while IFS='|' read -r hash msg; do
                echo "- $msg (\`$hash\`)" >> release_notes.md
              done
              echo >> release_notes.md
            fi

            if [ -n "$others" ]; then
              echo "### Other Changes" >> release_notes.md
              echo "$others" | while IFS='|' read -r hash msg; do
                echo "- $msg (\`$hash\`)" >> release_notes.md
              done
              echo >> release_notes.md
            fi
          else
            echo "Initial release." >> release_notes.md
            echo >> release_notes.md
          fi

          cat >> release_notes.md <<'NOTESEOF'
          ---

          ## Download

          | Platform | Arch | File |
          |----------|------|------|
          | macOS | Intel | `cli-proxy-api-darwin-amd64` |
          | macOS | Apple Silicon | `cli-proxy-api-darwin-arm64` |
          | Linux | x86_64, plugins | `cli-proxy-api-linux-amd64` |
          | Linux | ARM64, plugins | `cli-proxy-api-linux-arm64` |
          | Windows | x86_64 | `cli-proxy-api-windows-amd64.exe` |

          Linux builds support dynamic library plugins and target a GLIBC 2.17 baseline.

          **Checksum**: See `checksums.txt` in release assets.

          ## Verify

          ```bash
          sha256sum -c checksums.txt
          ```
          NOTESEOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: Release ${{ steps.metadata.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: release_notes.md
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
